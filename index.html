<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VibeTube — Connect & Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ═══════════════════════════════════════════════════════════
   VIBETUBE — DESIGN SYSTEM (Insta + YT)
   ═══════════════════════════════════════════════════════════ */
:root {
  --primary: #ff0050; /* TikTok/Vibe color */
  --yt-red: #ff0000;
  --bg: #ffffff;
  --surface: #f8f9fa;
  --surface-2: #ffffff;
  --text: #0f0f0f;
  --text-2: #606060;
  --border: #e5e5e5;
  --hover: #f2f2f2;
  --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
}
[data-theme="dark"] {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface-2: #212121;
  --text: #f1f1f1;
  --text-2: #aaaaaa;
  --border: #3a3a3a;
  --hover: #272727;
  --shadow: 0 4px 12px rgba(0,0,0,0.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 60px; transition: background 0.3s, color 0.3s; }
a { text-decoration: none; color: inherit; }
button { border: none; background: none; cursor: pointer; color: inherit; }

/* ═══ HEADER ═══ */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: 56px; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  z-index: 1000; border-bottom: 1px solid var(--border);
}
.logo { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.logo-icon { background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
.header-actions { display: flex; gap: 16px; align-items: center; font-size: 1.2rem; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.icon-btn:hover { background: var(--hover); }

/* ═══ LAYOUT ═══ */
.container { display: flex; max-width: 1400px; margin: 56px auto 0; }
.sidebar { width: 240px; position: fixed; top: 56px; bottom: 60px; left: 0; padding: 12px; overflow-y: auto; display: none; }
.main-content { flex: 1; margin-left: 0; width: 100%; max-width: 600px; margin: 0 auto; border-right: 1px solid var(--border); min-height: 100vh; }

@media (min-width: 900px) {
  .sidebar { display: block; }
  .main-content { margin-left: 240px; max-width: 800px; border-right: none; }
}

/* ═══ BOTTOM NAV (Mobile) ═══ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg);
  border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around;
  z-index: 1000;
}
.bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--text-2); }
.bottom-nav .nav-item.active { color: var(--text); font-weight: 600; }
.bottom-nav .nav-item i { font-size: 1.3rem; }
.bottom-nav .create-btn { background: var(--primary); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transform: translateY(-10px); box-shadow: 0 4px 10px rgba(255,0,80,0.4); }

@media (min-width: 900px) { .bottom-nav { display: none; } body { padding-bottom: 0; } }

/* ═══ SIDEBAR LINKS ═══ */
.sb-item { display: flex; align-items: center; gap: 16px; padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; transition: 0.2s; cursor: pointer; }
.sb-item:hover { background: var(--hover); }
.sb-item.active { background: var(--hover); font-weight: 700; }
.sb-item i { font-size: 1.2rem; width: 24px; text-align: center; }
.sb-divider { height: 1px; background: var(--border); margin: 12px 0; }

/* ═══ STORIES ═══ */
.stories-container { display: flex; gap: 14px; padding: 16px; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
.stories-container::-webkit-scrollbar { display: none; }
.story { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
.story-ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: var(--insta-grad); display: flex; align-items: center; justify-content: center; }
.story-ring.seen { background: var(--border); }
.story-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg); object-fit: cover; }
.story-name { font-size: 0.72rem; color: var(--text); max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ═══ INSTAGRAM POSTS ═══ */
.post { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; }
.post-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.post-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.post-user { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
.post-location { font-size: 0.75rem; color: var(--text-2); }
.post-more { margin-left: auto; color: var(--text-2); }
.post-image { width: 100%; max-height: 500px; object-fit: cover; display: block; }
.post-actions { display: flex; justify-content: space-between; padding: 12px 16px; font-size: 1.4rem; }
.post-actions-left { display: flex; gap: 16px; }
.post-actions i { cursor: pointer; transition: 0.2s; }
.post-actions i:hover { transform: scale(1.1); color: var(--text-2); }
.post-actions i.liked { color: var(--primary); animation: pop 0.3s; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
.post-likes { padding: 0 16px; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
.post-caption { padding: 0 16px; font-size: 0.9rem; line-height: 1.4; }
.post-caption span { font-weight: 600; margin-right: 6px; }
.post-comments { padding: 6px 16px 0; font-size: 0.85rem; color: var(--text-2); cursor: pointer; }

/* ═══ YOUTUBE VIDEOS ═══ */
.video-section { padding: 16px; }
.section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.video-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 600px) { .video-grid { grid-template-columns: 1fr 1fr; } }
.video-card { cursor: pointer; }
.video-thumbnail { width: 100%; aspect-ratio: 16/9; border-radius: 12px; object-fit: cover; background: var(--surface); }
.video-info { display: flex; gap: 12px; margin-top: 10px; }
.channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.video-title { font-weight: 600; font-size: 0.95rem; line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.video-meta { font-size: 0.8rem; color: var(--text-2); }
.badge-yt { background: var(--yt-red); color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; vertical-align: middle; margin-left: 6px; }

/* ═══ TABS ═══ */
.tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 56px; background: var(--bg); z-index: 100; }
.tab { flex: 1; text-align: center; padding: 12px 0; font-size: 0.9rem; font-weight: 600; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
.tab.active { color: var(--text); border-bottom-color: var(--text); }

/* ═══ VIDEO MODAL ═══ */
.video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
.video-modal.show { display: flex; }
.video-modal-content { width: 100%; max-width: 900px; background: #000; border-radius: 16px; overflow: hidden; position: relative; }
.video-modal iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
.close-modal { position: absolute; top: -40px; right: 0; color: #fff; font-size: 1.5rem; cursor: pointer; background: rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

/* ═══ CREATE MODAL ═══ */
.create-modal { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
.create-modal.show { display: flex; }
.create-header { height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
.create-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 20px; text-align: center; }
.create-option { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 300px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
.create-option:hover { background: var(--hover); }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
    VibeTube
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeToggle"><i class="fa-solid fa-sun"></i></button>
    <button class="icon-btn"><i class="fa-solid fa-comment-dots"></i></button>
    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
  </div>
</header>

<div class="container">
  <!-- SIDEBAR (Desktop) -->
  <aside class="sidebar">
    <div class="sb-item active"><i class="fa-solid fa-house"></i> Home</div>
    <div class="sb-item"><i class="fa-solid fa-fire"></i> Trending</div>
    <div class="sb-item"><i class="fa-solid fa-tv"></i> Subscriptions</div>
    <div class="sb-item"><i class="fa-solid fa-video"></i> Shorts</div>
    <div class="sb-divider"></div>
    <div class="sb-item"><i class="fa-solid fa-clock-rotate-left"></i> History</div>
    <div class="sb-item"><i class="fa-solid fa-list"></i> Playlists</div>
    <div class="sb-item"><i class="fa-solid fa-user"></i> Profile</div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" data-tab="feed">Feed</div>
      <div class="tab" data-tab="videos">Videos</div>
      <div class="tab" data-tab="shorts">Shorts</div>
    </div>

    <!-- STORIES -->
    <div class="stories-container" id="storiesContainer">
      <!-- Dynamic Stories -->
    </div>

    <!-- INSTAGRAM FEED -->
    <div id="feedSection">
      <!-- Dynamic Posts -->
    </div>

    <!-- YOUTUBE VIDEO GRID -->
    <div id="videoSection" style="display: none;">
      <div class="video-section">
        <div class="section-title"><i class="fa-brands fa-youtube" style="color: var(--yt-red);"></i> Recommended</div>
        <div class="video-grid" id="videoGrid">
          <!-- Dynamic Videos -->
        </div>
      </div>
    </div>

    <!-- SHORTS (Placeholder) -->
    <div id="shortsSection" style="display: none; text-align: center; padding: 50px 20px;">
      <i class="fa-solid fa-video" style="font-size: 4rem; color: var(--primary); margin-bottom: 20px;"></i>
      <h2 style="margin-bottom: 10px;">Shorts Coming Soon!</h2>
      <p style="color: var(--text-2);">Swipe up to watch endless short videos.</p>
    </div>

  </main>
</div>

<!-- BOTTOM NAV (Mobile) -->
<nav class="bottom-nav">
  <div class="nav-item active" data-tab="feed"><i class="fa-solid fa-house"></i> Home</div>
  <div class="nav-item" data-tab="videos"><i class="fa-solid fa-tv"></i> Videos</div>
  <div class="nav-item" onclick="openCreateModal()"><div class="create-btn"><i class="fa-solid fa-plus"></i></div></div>
  <div class="nav-item" data-tab="shorts"><i class="fa-solid fa-video"></i> Shorts</div>
  <div class="nav-item"><i class="fa-regular fa-user"></i> Profile</div>
</nav>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal">
  <div class="video-modal-content">
    <button class="close-modal" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></button>
    <iframe id="videoIframe" src="" allowfullscreen></iframe>
  </div>
</div>

<!-- CREATE MODAL -->
<div class="create-modal" id="createModal">
  <div class="create-header">
    <button onclick="closeCreateModal()" style="margin-right: 16px; font-size: 1.2rem;"><i class="fa-solid fa-xmark"></i></button>
    Create New
  </div>
  <div class="create-body">
    <div class="create-option">
      <i class="fa-solid fa-image" style="color: #e6683c; font-size: 1.5rem;"></i> Upload Post
    </div>
    <div class="create-option">
      <i class="fa-solid fa-video" style="color: var(--yt-red); font-size: 1.5rem;"></i> Upload Video
    </div>
    <div class="create-option">
      <i class="fa-solid fa-bolt" style="color: var(--primary); font-size: 1.5rem;"></i> Create Short
    </div>
    <div class="create-option">
      <i class="fa-solid fa-circle-play" style="color: #1da1f2; font-size: 1.5rem;"></i> Go Live
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// VIBETUBE — JAVASCRIPT LOGIC
// ═══════════════════════════════════════════════════════════

// --- DATA ---
const stories = [
  { id: 1, name: 'Your Story', img: 'https://i.pravatar.cc/150?img=1', seen: false, isUser: true },
  { id: 2, name: 'Cristiano', img: 'https://i.pravatar.cc/150?img=11', seen: false },
  { id: 3, name: 'Lionel', img: 'https://i.pravatar.cc/150?img=12', seen: true },
  { id: 4, name: 'Neymar', img: 'https://i.pravatar.cc/150?img=13', seen: false },
  { id: 5, name: 'Kylian', img: 'https://i.pravatar.cc/150?img=14', seen: true },
  { id: 6, name: 'Erling', img: 'https://i.pravatar.cc/150?img=15', seen: false },
];

const posts = [
  {
    id: 1, user: 'Sarah Jenkins', avatar: 'https://i.pravatar.cc/150?img=5', location: 'Bali, Indonesia',
    image: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=800&q=80',
    likes: 1240, caption: 'Paradise found. 🌴☀️ #bali #travel #vacation', liked: false
  },
  {
    id: 2, user: 'Tech Daily', avatar: 'https://i.pravatar.cc/150?img=8', location: 'San Francisco, CA',
    image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&q=80',
    likes: 856, caption: 'Just finished setting up the new coding station! 🖥️🚀 #tech #setup', liked: true
  },
  {
    id: 3, user: 'Foodie Heaven', avatar: 'https://i.pravatar.cc/150?img=9', location: 'Tokyo, Japan',
    image: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800&q=80',
    likes: 3420, caption: 'The best pizza in the world! 🍕🤤 #food #tokyo #pizza', liked: false
  }
];

const videos = [
  {
    id: 1, title: 'Relaxing Lofi Beats to Study/Work to 📚🎧', channel: 'Lofi Girl', avatar: 'https://i.pravatar.cc/150?img=20',
    views: '1.2M views', time: '2 days ago', thumb: 'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=600&q=80',
    videoId: 'jfKfPfyJRdk' // YouTube Video ID
  },
  {
    id: 2, title: 'The Future of AI in 2025 (Mind Blowing)', channel: 'Tech Insights', avatar: 'https://i.pravatar.cc/150?img=21',
    views: '450K views', time: '1 week ago', thumb: 'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600&q=80',
    videoId: '5l4A43j2mS0'
  },
  {
    id: 3, title: 'Building a $10,000 PC Setup! 🔥', channel: 'Mr. Builder', avatar: 'https://i.pravatar.cc/150?img=22',
    views: '890K views', time: '3 days ago', thumb: 'https://images.unsplash.com/photo-1593640408182-31c70c8268f5?w=600&q=80',
    videoId: 'M5dS8fE4b8Q'
  },
  {
    id: 4, title: 'Space Documentary: Journey to Mars 🚀', channel: 'Space Vision', avatar: 'https://i.pravatar.cc/150?img=23',
    views: '2.3M views', time: '1 month ago', thumb: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&q=80',
    videoId: 'IvzRBHwF4xE'
  }
];

// --- RENDER STORIES ---
const storiesContainer = document.getElementById('storiesContainer');
function renderStories() {
  storiesContainer.innerHTML = stories.map(story => `
    <div class="story" onclick="viewStory(${story.id})">
      <div class="story-ring ${story.seen ? 'seen' : ''}">
        <img src="${story.img}" class="story-img" alt="${story.name}">
      </div>
      <span class="story-name">${story.name}</span>
    </div>
  `).join('');
}

// --- RENDER POSTS (Insta Feed) ---
const feedSection = document.getElementById('feedSection');
function renderPosts() {
  feedSection.innerHTML = posts.map(post => `
    <div class="post" id="post-${post.id}">
      <div class="post-header">
        <img src="${post.avatar}" class="post-avatar" alt="${post.user}">
        <div>
          <div class="post-user">${post.user} <i class="fa-solid fa-circle-check" style="color: #1da1f2; font-size: 0.7rem;"></i></div>
          <div class="post-location">${post.location}</div>
        </div>
        <button class="post-more"><i class="fa-solid fa-ellipsis"></i></button>
      </div>
      <img src="${post.image}" class="post-image" alt="Post">
      <div class="post-actions">
        <div class="post-actions-left">
          <i class="${post.liked ? 'fa-solid fa-heart liked' : 'fa-regular fa-heart'}" onclick="toggleLike(${post.id})"></i>
          <i class="fa-regular fa-comment"></i>
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <i class="fa-regular fa-bookmark"></i>
      </div>
      <div class="post-likes" id="likes-${post.id}">${post.likes.toLocaleString()} likes</div>
      <div class="post-caption"><span>${post.user}</span> ${post.caption}</div>
      <div class="post-comments">View all 124 comments</div>
    </div>
  `).join('');
}

// --- RENDER VIDEOS (YT Grid) ---
const videoGrid = document.getElementById('videoGrid');
function renderVideos() {
  videoGrid.innerHTML = videos.map(vid => `
    <div class="video-card" onclick="playVideo('${vid.videoId}')">
      <img src="${vid.thumb}" class="video-thumbnail" alt="${vid.title}">
      <div class="video-info">
        <img src="${vid.avatar}" class="channel-avatar" alt="${vid.channel}">
        <div>
          <div class="video-title">${vid.title}</div>
          <div class="video-meta">${vid.channel} <span class="badge-yt">YT</span></div>
          <div class="video-meta">${vid.views} • ${vid.time}</div>
        </div>
      </div>
    </div>
  `).join('');
}

// --- ACTIONS ---
function toggleLike(id) {
  const post = posts.find(p => p.id === id);
  const icon = document.querySelector(`#post-${id} .fa-heart`);
  const likesEl = document.getElementById(`likes-${id}`);
  
  if(post.liked) {
    post.liked = false;
    post.likes--;
    icon.classList.remove('fa-solid', 'liked');
    icon.classList.add('fa-regular');
  } else {
    post.liked = true;
    post.likes++;
    icon.classList.remove('fa-regular');
    icon.classList.add('fa-solid', 'liked');
  }
  likesEl.textContent = `${post.likes.toLocaleString()} likes`;
}

function viewStory(id) {
  const story = stories.find(s => s.id === id);
  story.seen = true;
  renderStories();
}

// --- TABS LOGIC ---
const tabs = document.querySelectorAll('.tab');
const navItems = document.querySelectorAll('.nav-item[data-tab]');
const sections = {
  feed: document.getElementById('feedSection'),
  videos: document.getElementById('videoSection'),
  shorts: document.getElementById('shortsSection')
};

function switchTab(tabName) {
  // Update tabs UI
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
  navItems.forEach(n => n.classList.toggle('active', n.dataset.tab === tabName));
  
  // Update content
  Object.keys(sections).forEach(key => {
    sections[key].style.display = key === tabName ? 'block' : 'none';
  });
}

tabs.forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));
navItems.forEach(item => item.addEventListener('click', () => switchTab(item.dataset.tab)));

// --- VIDEO PLAYER ---
const videoModal = document.getElementById('videoModal');
const videoIframe = document.getElementById('videoIframe');

function playVideo(videoId) {
  videoIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  videoModal.classList.add('show');
}

function closeVideo() {
  videoModal.classList.remove('show');
  videoIframe.src = '';
}

// --- CREATE MODAL ---
const createModal = document.getElementById('createModal');
function openCreateModal() { createModal.classList.add('show'); }
function closeCreateModal() { createModal.classList.remove('show'); }

// --- THEME TOGGLE ---
const themeToggle = document.getElementById('themeToggle');
let isDark = true;

themeToggle.addEventListener('click', () => {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeToggle.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
});

// --- INITIALIZE ---
renderStories();
renderPosts();
renderVideos();
</script>
</body>
</html>
